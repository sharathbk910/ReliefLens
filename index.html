<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>ResQWave — Connecting Emergencies to Action</title>
    <meta name="title" content="ResQWave — Connecting Emergencies to Action" />
    <meta name="description" content="ResQWave is a modern, transparent emergency rescue coordination and disaster response platform. Real-time incident triage, live disaster maps, multilingual voice reporting, and deterministic duplicate detection." />
    <meta name="keywords" content="ResQWave, emergency rescue, disaster response, flood relief, emergency dispatch, search and rescue, crisis response, emergency triage, humanitarian action, multilingual emergency reporting" />
    <meta name="author" content="ResQWave Emergency Coordination Network" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="theme-color" content="#090e17" />
    <link rel="canonical" href="https://resqwave.org/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://resqwave.org/" />
    <meta property="og:site_name" content="ResQWave" />
    <meta property="og:title" content="ResQWave — Connecting Emergencies to Action" />
    <meta property="og:description" content="Trapped or coordinating crisis response? ResQWave connects emergency calls directly to rapid rescue action with transparent, explainable triage." />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="ResQWave Emergency Response Logo" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://resqwave.org/" />
    <meta property="twitter:title" content="ResQWave — Connecting Emergencies to Action" />
    <meta property="twitter:description" content="Modern humanitarian disaster response and rapid emergency dispatch coordination platform." />
    <meta property="twitter:image" content="/logo.png" />

    <!-- Icons & Manifest -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Google Fonts: Inter, Outfit, & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS for maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Schema.org JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "EmergencyService",
          "@id": "https://resqwave.org/#organization",
          "name": "ResQWave Emergency Coordination Network",
          "alternateName": "ResQWave",
          "slogan": "Connecting Emergencies to Action",
          "url": "https://resqwave.org/",
          "logo": "https://resqwave.org/logo.png",
          "image": "https://resqwave.org/logo.png",
          "description": "Transparent emergency incident coordination, deterministic priority scoring, and human-in-the-loop disaster response dispatch.",
          "serviceType": "Emergency Rescue and Disaster Incident Response",
          "areaServed": "Global",
          "availableLanguage": ["English", "Kannada", "Hindi", "Tamil", "Telugu", "Spanish"],
          "telephone": "911"
        },
        {
          "@type": "WebSite",
          "@id": "https://resqwave.org/#website",
          "url": "https://resqwave.org/",
          "name": "ResQWave",
          "description": "Connecting Emergencies to Action — Modern humanitarian emergency dispatch coordination."
        }
      ]
    }
    </script>
    <!-- Inline script to enforce dark mode automatically on load -->
    <script>
      (function() {
        try {
          var migrated = localStorage.getItem('resqwave-dark-default-v2');
          if (!migrated) {
            localStorage.setItem('resqwave-dark-default-v2', 'true');
            localStorage.setItem('resqwave-theme-mode', 'dark');
            localStorage.setItem('resqwave-theme', 'dark');
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            var mode = localStorage.getItem('resqwave-theme-mode');
            if (mode === 'light') {
              document.documentElement.classList.remove('dark');
              document.documentElement.classList.add('light');
            } else {
              document.documentElement.classList.add('dark');
              document.documentElement.classList.remove('light');
            }
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#090e17] dark:text-slate-100 antialiased font-sans selection:bg-teal-500/20 selection:text-teal-900 dark:selection:text-teal-200 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
